name: Local secure fork checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run check
      - run: npm test
