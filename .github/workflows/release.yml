name: Validate legacy release sources
on: workflow_dispatch
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run check
      - run: npm test
